<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | MiningInspect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">

  <!-- Supabase & App -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/app.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>

<body class="bg-slate-100 text-slate-800">

<!-- ===================== -->
<!-- SIDEBAR -->
<!-- ===================== -->
<aside class="fixed inset-y-0 left-0 w-56 bg-slate-900 text-slate-300 flex flex-col z-40">

  <div class="px-6 py-5 border-b border-slate-800">
    <div class="text-lg font-extrabold text-white tracking-tight">
      MiningInspect
    </div>
    <div class="text-xs text-slate-400 uppercase tracking-widest">
      Safety System
    </div>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-1 text-sm font-medium">
    <a href="dashboard.html"
       class="flex items-center gap-3 px-4 py-3 rounded-lg bg-slate-800 text-white">
      Dashboard
    </a>

    <a href="inspeksi-baru.html"
       class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
      Inspeksi Baru
    </a>
  </nav>

  <div class="px-4 py-4 border-t border-slate-800 text-xs text-slate-400">
    Sistem Inspeksi Keselamatan
  </div>
</aside>

<!-- ===================== -->
<!-- MAIN AREA -->
<!-- ===================== -->
<div class="ml-56 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200">
    <div class="flex justify-between items-center px-8 py-4">
      <div>
        <h1 class="text-xl font-extrabold text-slate-900">
          Dashboard
        </h1>
        <p class="text-xs text-slate-500">
          Ringkasan inspeksi keselamatan
        </p>
      </div>

      <div class="flex items-center gap-4">
        <!-- EMAIL USER (diisi app.js) -->
        <span class="text-sm text-slate-500 hidden md:block" id="user-email"></span>

        <a href="inspeksi-baru.html"
           class="px-5 py-2.5 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition">
          + Inspeksi Baru
        </a>

        <button id="btnLogout"
                class="px-4 py-2 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700 transition">
          Logout
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 px-8 py-8">

    <!-- KPI -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">

      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">
          Total Inspeksi
        </p>
        <p id="total-inspeksi" class="mt-3 text-4xl font-extrabold text-slate-900">
          0
        </p>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">
          Draft
        </p>
        <p id="total-draft" class="mt-3 text-4xl font-extrabold text-amber-600">
          0
        </p>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-6">
        <p class="text-xs uppercase tracking-widest text-slate-400 font-bold">
          Closed
        </p>
        <p id="total-closed" class="mt-3 text-4xl font-extrabold text-green-600">
          0
        </p>
      </div>

    </section>

    <!-- ACTIVITY -->
    <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">

      <div class="px-8 py-5 border-b border-slate-100 bg-slate-50">
        <h2 class="text-sm font-extrabold text-slate-700 uppercase tracking-widest">
          Aktivitas Inspeksi Terakhir
        </h2>
      </div>

      <!-- DIISI dashboard.js -->
      <div id="inspection-list" class="min-h-[240px]">
        <!-- dynamic content -->
      </div>

    </section>

  </main>

</div>

<!-- ===================== -->
<!-- LOGOUT HANDLER (UI ONLY) -->
<!-- ===================== -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (window.supabaseClient) {
      const { data: { user } } = await window.supabaseClient.auth.getUser();
      if (user) {
        document.getElementById('user-email').innerText = user.email;
      }
    }

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await window.supabaseClient.auth.signOut();
      location.replace('index.html');
    });
  });
</script>

</body>
</html>
