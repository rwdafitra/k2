<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | MiningInspect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- App -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/app.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>

<body class="bg-slate-950 text-slate-200">

<!-- ===================== -->
<!-- SIDEBAR -->
<!-- ===================== -->
<aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-40">

  <div class="px-6 py-6 border-b border-slate-800">
    <div class="text-xl font-black tracking-wide text-amber-400">
      MININGINSPECT
    </div>
    <div class="text-xs tracking-widest text-slate-500 mt-1">
      SAFETY CONTROL PANEL
    </div>
  </div>

  <nav class="flex-1 px-4 py-6 space-y-2 text-sm font-semibold">
    <a href="dashboard.html"
       class="block px-4 py-3 rounded-md bg-slate-800 border border-slate-700 text-amber-400">
      Dashboard
    </a>

    <a href="inspeksi-baru.html"
       class="block px-4 py-3 rounded-md border border-transparent hover:border-slate-700 hover:bg-slate-800">
      Inspeksi Baru
    </a>
  </nav>

  <div class="px-6 py-4 border-t border-slate-800 text-xs text-slate-500">
    Sistem Inspeksi Keselamatan Tambang
  </div>
</aside>

<!-- ===================== -->
<!-- MAIN -->
<!-- ===================== -->
<div class="ml-64 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800">
    <div class="flex justify-between items-center px-8 py-5">
      <div>
        <h1 class="text-2xl font-black tracking-wide text-slate-100">
          DASHBOARD
        </h1>
        <p class="text-xs tracking-widest text-slate-500 mt-1">
          STATUS OPERASIONAL INSPEKSI
        </p>
      </div>

      <div class="flex items-center gap-4">
        <span id="user-email" class="text-sm text-slate-400"></span>

        <a href="inspeksi-baru.html"
           class="px-6 py-3 bg-amber-500 text-slate-900 font-extrabold tracking-wide rounded-md hover:bg-amber-400 transition">
          + INSPEKSI
        </a>

        <button id="btnLogout"
                class="px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 font-bold rounded-md hover:bg-red-600 transition">
          LOGOUT
        </button>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 px-8 py-8 space-y-8">

    <!-- KPI PANELS -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div class="bg-slate-900 border border-slate-800 rounded-md p-6 shadow-lg">
        <p class="text-xs tracking-widest text-slate-500">
          TOTAL INSPEKSI
        </p>
        <p id="total-inspeksi" class="mt-4 text-5xl font-black text-slate-100">
          0
        </p>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-md p-6 shadow-lg">
        <p class="text-xs tracking-widest text-slate-500">
          DRAFT
        </p>
        <p id="total-draft" class="mt-4 text-5xl font-black text-amber-400">
          0
        </p>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-md p-6 shadow-lg">
        <p class="text-xs tracking-widest text-slate-500">
          CLOSED
        </p>
        <p id="total-closed" class="mt-4 text-5xl font-black text-green-400">
          0
        </p>
      </div>

    </section>

    <!-- ACTIVITY LOG -->
    <section class="bg-slate-900 border border-slate-800 rounded-md shadow-lg">

      <div class="px-6 py-4 border-b border-slate-800">
        <h2 class="text-sm font-black tracking-widest text-slate-300">
          LOG AKTIVITAS INSPEKSI
        </h2>
      </div>

      <div id="inspection-list" class="divide-y divide-slate-800">
        <!-- diisi dashboard.js -->
      </div>

    </section>

  </main>
</div>

<!-- ===================== -->
<!-- AUTH INFO -->
<!-- ===================== -->
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (window.supabaseClient) {
    const { data: { user } } = await window.supabaseClient.auth.getUser();
    if (user) {
      document.getElementById('user-email').innerText = user.email;
    }
  }

  document.getElementById('btnLogout').addEventListener('click', async () => {
    await window.supabaseClient.auth.signOut();
    location.replace('index.html');
  });
});
</script>

</body>
</html>
