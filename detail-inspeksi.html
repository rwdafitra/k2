<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Inspeksi | MiningInspect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="js/app.js" defer></script>
  <script src="js/detail-inspeksi.js" defer></script>
</head>
<body class="bg-slate-50">
  <div id="navbar"></div>

  <div class="app-container" id="printable-area">
    <div class="mb-8 flex justify-between items-end">
      <div>
        <a href="dashboard.html" class="text-blue-600 font-bold text-sm hover:underline no-print">← Kembali ke Dashboard</a>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mt-2">Laporan Inspeksi Keselamatan</h1>
      </div>
      <div class="flex gap-3 no-print">
        <button id="btnDownloadPDF" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-red-700 transition">
          Cetak PDF
        </button>
        <div id="status-badge"></div>
      </div>
    </div>

    <div class="card-pro p-8 mb-8 grid grid-cols-1 md:grid-cols-3 gap-6 bg-white">
      <div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tanggal Inspeksi</p>
        <p id="det-tanggal" class="font-bold text-slate-800">-</p>
      </div>
      <div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Lokasi Utama</p>
        <p id="det-lokasi" class="font-bold text-slate-800">-</p>
      </div>
      <div>
        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Area Kerja</p>
        <p id="det-area" class="font-bold text-slate-800">-</p>
      </div>
    </div>

    <div id="findings-list" class="space-y-6">
      </div>
  </div>

  <style>
    @media print {
      .no-print { display: none !important; }
    }
  </style>
</body>
</html>
