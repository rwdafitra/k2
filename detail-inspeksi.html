<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Inspeksi | MiningInspect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <script src="js/app.js" defer></script>
  <script src="js/detail-inspeksi.js" defer></script>

  <style>
    #signature-pad { touch-action: none; }
    .html2pdf__page-break { page-break-after: always; }
    .no-print { display: block; }
  </style>
</head>
<body class="bg-slate-50">
  
  <div id="navbar"></div>

  <div class="app-container">
    <div id="printable-area" class="bg-white p-2 md:p-8 rounded-2xl shadow-sm border border-slate-100">
      
      <div class="flex justify-between items-start mb-10 border-b pb-6">
        <div>
          <a href="dashboard.html" class="text-blue-600 font-bold text-sm hover:underline no-print mb-4 inline-block">
            ← Kembali ke Dashboard
          </a>
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Laporan Inspeksi Keselamatan</h1>
        </div>
        <div class="flex flex-col items-end gap-3">
          <div id="status-badge"></div>
          <button id="btnDownloadPDF" class="no-print bg-red-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-red-100 hover:bg-red-700 transition-all transform hover:scale-105 active:scale-95">
            Cetak PDF Resmi
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-100">
        <div>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Tanggal Inspeksi</p>
          <p id="det-tanggal" class="font-bold text-slate-800 text-lg">-</p>
        </div>
        <div>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Lokasi Utama</p>
          <p id="det-lokasi" class="font-bold text-slate-800 text-lg">-</p>
        </div>
        <div>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Area Kerja</p>
          <p id="det-area" class="font-bold text-slate-800 text-lg">-</p>
        </div>
      </div>

      <div id="comment-section" class="mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
          <p class="text-[10px] font-black text-blue-400 uppercase mb-2">Saran Dept SHE</p>
          <p id="display-she" class="text-sm italic text-slate-600 mb-3">Belum ada komentar.</p>
          <div id="input-she" class="hidden no-print">
            <textarea id="text-she" class="w-full text-xs p-2 border rounded" placeholder="Ketik saran..."></textarea>
            <button onclick="saveComment('she')" class="mt-2 text-[10px] bg-blue-600 text-white px-3 py-1 rounded font-bold uppercase">Simpan</button>
          </div>
        </div>
        <div class="p-4 bg-green-50 rounded-xl border border-green-100">
          <p class="text-[10px] font-black text-green-400 uppercase mb-2">Saran AMN Operasi</p>
          <p id="display-amn" class="text-sm italic text-slate-600 mb-3">Belum ada komentar.</p>
          <div id="input-amn" class="hidden no-print">
            <textarea id="text-amn" class="w-full text-xs p-2 border rounded" placeholder="Ketik saran..."></textarea>
            <button onclick="saveComment('amn')" class="mt-2 text-[10px] bg-green-600 text-white px-3 py-1 rounded font-bold uppercase">Simpan</button>
          </div>
        </div>
        <div class="p-4 bg-red-50 rounded-xl border border-red-100">
          <p class="text-[10px] font-black text-red-400 uppercase mb-2">Saran KTT</p>
          <p id="display-ktt" class="text-sm italic text-slate-600 mb-3">Belum ada komentar.</p>
          <div id="input-ktt" class="hidden no-print">
            <textarea id="text-ktt" class="w-full text-xs p-2 border rounded" placeholder="Ketik saran..."></textarea>
            <button onclick="saveComment('ktt')" class="mt-2 text-[10px] bg-red-600 text-white px-3 py-1 rounded font-bold uppercase">Simpan</button>
          </div>
        </div>
      </div>

      <div id="findings-list" class="space-y-8">
        <div class="p-20 text-center text-slate-400 animate-pulse">Memuat data temuan...</div>
      </div>

      <div class="mt-12 pt-8 border-t border-slate-200">
        <div class="w-full max-w-sm">
          <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Pengesahan Inspektur</h2>
          <div class="relative bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-2 mb-4">
            <canvas id="signature-pad" class="w-full h-40 cursor-crosshair" width="400" height="200"></canvas>
            <button id="btnClearSign" class="no-print absolute top-4 right-4 text-[10px] bg-white shadow-sm border px-3 py-1 rounded-full font-bold text-red-600">ULANGI</button>
          </div>
          <p id="inspector-name" class="font-extrabold text-slate-900 text-lg border-b-2 border-slate-900 inline-block px-4 pb-1 uppercase">-</p>
          <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mt-2">Safety Inspector</p>
        </div>
      </div>

    </div>
  </div>

  <div id="modal-closeout" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
      <h3 class="text-xl font-bold mb-4">Close-Out Temuan</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold mb-1 uppercase text-slate-400">Bukti Perbaikan (Foto)</label>
          <input type="file" id="file-perbaikan" class="w-full text-sm border p-2 rounded" accept="image/*">
        </div>
        <div>
          <label class="block text-xs font-bold mb-1 uppercase text-slate-400">Keterangan Perbaikan</label>
          <textarea id="ket-perbaikan" class="w-full border p-2 rounded h-24 text-sm" placeholder="Jelaskan tindakan perbaikan..."></textarea>
        </div>
        <div class="flex gap-2">
          <button onclick="toggleModalClose(false)" class="flex-1 py-2 bg-slate-100 font-bold rounded-lg text-slate-600 uppercase text-xs">Batal</button>
          <button id="btnSimpanCloseOut" class="flex-1 py-2 bg-green-600 font-bold rounded-lg text-white uppercase text-xs">Simpan Perbaikan</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
