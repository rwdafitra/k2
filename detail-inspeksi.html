<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Inspeksi | MiningInspect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/app.js" defer></script>
  <script src="js/detail-inspeksi.js" defer></script>
  <style>
    #signature-pad { touch-action: none; }
    .html2pdf__page-break { page-break-after: always; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="navbar"></div>
  <div class="app-container">
    <div id="printable-area" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
      
      <div class="flex justify-between items-start mb-8 border-b pb-6">
        <div>
          <a href="dashboard.html" class="text-blue-600 font-bold text-sm hover:underline no-print mb-4 inline-block">← Kembali</a>
          <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Laporan Inspeksi</h1>
        </div>
        <button id="btnDownloadPDF" class="no-print bg-red-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-red-700 transition">Cetak PDF</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 bg-slate-50 p-6 rounded-2xl border">
        <div><p class="text-[10px] font-black text-slate-400 uppercase mb-1">Tanggal</p><p id="det-tanggal" class="font-bold">-</p></div>
        <div><p class="text-[10px] font-black text-slate-400 uppercase mb-1">Lokasi</p><p id="det-lokasi" class="font-bold">-</p></div>
        <div><p class="text-[10px] font-black text-slate-400 uppercase mb-1">Area</p><p id="det-area" class="font-bold">-</p></div>
      </div>

      <div id="findings-list" class="space-y-6 mb-10"></div>

      <div class="mt-10 pt-8 border-t border-slate-200">
        <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-6">Saran & Arahan Manajemen</h2>
        <div id="comments-thread" class="space-y-4 mb-6">
          <p class="text-xs text-slate-400 italic">Belum ada arahan manajemen.</p>
        </div>
        <div id="admin-comment-form" class="hidden no-print bg-slate-50 p-6 rounded-2xl border">
          <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Input Saran Sebagai <span id="label-role" class="text-blue-600"></span></label>
          <textarea id="input-comment-text" class="w-full border rounded-xl p-3 text-sm mb-3" placeholder="Tulis instruksi perbaikan..."></textarea>
          <button id="btnSubmitComment" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-xs uppercase">Kirim Komentar</button>
        </div>
      </div>

      <div class="mt-12 pt-8 border-t border-slate-200">
        <div class="w-full max-w-sm">
          <h2 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Pengesahan Inspektur</h2>
          <div class="relative bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-2 mb-4">
            <canvas id="signature-pad" class="w-full h-40 cursor-crosshair" width="400" height="200"></canvas>
            <button id="btnClearSign" class="no-print absolute top-2 right-2 text-[10px] bg-white border px-2 py-1 rounded-full font-bold text-red-600">RESET</button>
          </div>
          <p id="inspector-name" class="font-extrabold text-slate-900 border-b-2 border-slate-900 inline-block px-4 uppercase">-</p>
          <p class="text-[10px] font-black text-blue-600 uppercase mt-2">Safety Inspector</p>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-closeout" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
      <h3 class="text-xl font-bold mb-4">Upload Bukti Perbaikan</h3>
      <input type="file" id="file-perbaikan" class="w-full text-sm border p-2 rounded mb-4" accept="image/*">
      <textarea id="ket-perbaikan" class="w-full border p-2 rounded h-24 text-sm mb-4" placeholder="Keterangan perbaikan..."></textarea>
      <div class="flex gap-2">
        <button onclick="toggleModalClose(false)" class="flex-1 py-2 bg-slate-100 rounded-lg text-xs font-bold">BATAL</button>
        <button id="btnSimpanCloseOut" class="flex-1 py-2 bg-green-600 text-white rounded-lg text-xs font-bold">SIMPAN PERBAIKAN</button>
      </div>
    </div>
  </div>
</body>
</html>
