<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Login | Inspeksi Tambang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/app.js" defer></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-6 rounded shadow w-full max-w-sm">
    <h1 class="text-xl font-bold text-center mb-4">Aplikasi Inspeksi Tambang</h1>
    <form id="login-form">
      <input id="emailInput" type="email" class="w-full p-2 border rounded mb-3" placeholder="Email" required />
      <input id="passwordInput" type="password" class="w-full p-2 border rounded mb-4" placeholder="Password" required />
      <button class="w-full bg-blue-700 text-white py-2 rounded font-semibold">Login</button>
    </form>
    <p id="info" class="text-sm text-red-600 mt-3 text-center"></p>
  </div>
</body>
</html>
