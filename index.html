<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login | MiningInspect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

  <div class="card-pro w-full max-w-md p-10">
    <form id="login-form" class="space-y-6">
      <input id="emailInput" type="email" class="input-pro" placeholder="Email" required>
      <input id="passwordInput" type="password" class="input-pro" placeholder="Password" required>
      <button type="submit" class="btn-primary w-full">Login</button>
      <p id="info" class="text-red-500 text-sm"></p>
    </form>
  </div>

  <!-- ✅ SUPABASE HARUS PERTAMA -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

  <!-- ✅ BARU APP & AUTH -->
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
