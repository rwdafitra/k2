<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Input Inspeksi | MiningInspect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/app.js" defer></script>
  <script src="js/inspeksi-baru.js" defer></script>
</head>
<body class="bg-slate-50">
  <div id="navbar"></div>

  <div class="app-container">
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Formulir Inspeksi</h1>
      <p class="text-slate-500 font-medium">Lengkapi data temuan dan lampirkan bukti foto.</p>
    </div>

    <div class="card-pro p-8 mb-8">
      <h2 class="text-sm font-bold text-blue-700 uppercase tracking-widest mb-6">Informasi Utama</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Tanggal Inspeksi</label>
          <input type="date" id="tanggal_inspeksi" class="input-pro">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Lokasi Tambang</label>
          <input type="text" id="lokasi_tambang" class="input-pro" placeholder="Nama Pit/Lokasi">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Area Kerja</label>
          <input type="text" id="area_kerja" class="input-pro" placeholder="Area Kerja">
        </div>
      </div>
    </div>

    <div id="findingsContainer"></div>

    <div class="flex flex-col md:flex-row gap-4 mt-8">
      <button id="btnAddFinding" class="flex-1 bg-white border-2 border-blue-700 text-blue-700 py-4 rounded-xl font-bold hover:bg-blue-50 transition">
        + TAMBAH TEMUAN LAIN
      </button>
      <button id="btnSubmit" class="flex-1 bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-green-700 transition transform active:scale-95">
        SIMPAN SEMUA DATA
      </button>
    </div>
  </div>
</body>
</html>
